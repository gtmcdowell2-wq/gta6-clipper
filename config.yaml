paths:
  data_dir: data
  db: data/clipper.db

download:
  max_height: 1080
  chunk_hours: 2            # chunk size for finished VODs
  live_chunk_minutes: 30    # while a streamer is live: shorter chunks, so clips post ~40 min after the moment
  raw_vod_retention_days: 3 # delete raw VODs this long after their clips are approved

transcribe:
  model_gpu: large-v3-turbo # near large-v3 accuracy, several times faster on an NVIDIA card
  model_cpu: small
  language: en

signals:
  candidates_per_2h: 30
  context_seconds: 90       # transcript sent to the LLM on each side of a spike
  chat_hype_terms: ["LMAO", "LMFAO", "OMG", "W", "L", "💀", "😭", "KEKW", "LUL", "NO WAY", "CLIP IT", "CLIP THAT"]

selector:
  provider: anthropic       # anthropic | file (offline: write requests to disk, read answers back)
  model: claude-opus-5-5    # cheaper: claude-sonnet-5-5 or claude-haiku-5-5
  effort: medium
  backup_picker: outage     # outage: rule-based picks if Claude is down | always: also with no API key | off
  backup_after_minutes: 45  # how long Claude must be unavailable before the Backup Picker steps in
  min_seconds: 15
  max_seconds: 90
  min_overall_score: 7
  preferred_archetypes: []  # filled in from stats once we know what wins

editor:
  width: 1080
  height: 1920
  fps: 60
  cam_ratio: 0.38           # share of the frame given to the facecam
  single_pane_aspect: 1.0   # no-facecam clips: width/height of the gameplay crop over the blurred fill
  hook_seconds: 3
  target_lufs: -14
  caption_styles: [bold_yellow, clean_white, pop_green]   # rotated per clip
  punch_in: rotate          # quick zoom-ins on the loudest reactions: rotate (2 of 3 clips) | always | off
  punch_zoom: 1.12
  punch_seconds: 0.7
  progress_bar: rotate      # thin progress bar on the cam/gameplay seam: rotate | always | off
  disclosure_seconds: 4     # paid-partnership badge at the start of campaign clips

safety:
  # Titles/descriptions containing any of these are skipped outright (rule: no leaked footage).
  leak_keywords: ["leak", "leaked", "early copy", "early access copy", "pre-release", "prerelease", "stolen build"]
  # Transcript hits flag the clip for manual spoiler review.
  spoiler_keywords: ["final mission", "last mission", "ending", "credits", "dies", "killed off", "plot twist"]
  graphic_violence_lead_seconds: 7
  # GTA 6's US release: midnight Eastern on Nov 19. Rockstar takes down pre-release footage, so clips recorded
  # before this are flagged by the Release Gate and their posts are held until after it.
  release_utc: "2026-11-19T05:00:00Z"
  # Permission levels that may ever be posted. "unknown" can be clipped for review but never posted.
  postable_permissions: [campaign, public_ok]
  auto_approve_threshold: null   # off. Leave off for the first weeks.

watcher:
  poll_minutes: 20
  game_patterns: ["gta 6", "gta vi", "gta6", "grand theft auto vi", "grand theft auto 6"]

posting:
  stagger_minutes: [60, 90]
  per_platform_daily: {youtube: 8, tiktok: 5, instagram: 8}   # TikTok allows 5 pending drafts per 24h
  active_hours: [8, 24]          # local time window posts may be scheduled in
  attended_hours: [9, 23]        # campaign posts (submit within 30 min) only go out when you're likely awake
  timezone: America/New_York     # audience timezone for the window above

review_app:
  host: 0.0.0.0             # reachable from a phone on the same Wi-Fi
  port: 8787               # (5000 is taken by AirPlay/other services on many machines)

agents:
  # The agent network (run_pipeline.py start). Each agent can also be paused from the control center.
  llm_model: claude-opus-5-5     # model for the Hook Critic (cheaper: claude-sonnet-5-5 / claude-haiku-5-5)
  include_unknown_sources: false # Scout skips sources that can't be posted anyway
  max_vods_per_source: 3
  max_vod_age_days: 4
  min_free_gb: 15                # Downloader pauses below this
  reach_weights: {selector: 25, share: 10, hook_critic: 15, signal: 15, archetype: 10, length: 5, fresh: 10, trend: 5, streamer: 5}

youtube:
  privacy_status: private        # private | unlisted | public. Do one private test upload, then switch to public.
  category_id: "20"              # Gaming
  tags: [GTA6, GTA 6, Grand Theft Auto VI, gaming, shorts]
  paid_product_placement: campaign  # campaign: declare paid placement on paid-campaign clips | true | false
  custom_thumbnails: true        # set the Thumbnail Maker's cover on each Short (needs a phone-verified channel)

tiktok:
  mode: inbox                    # sends a draft to your TikTok inbox; you tap Post in the app

instagram:
  api_version: v27.0

llm:
  # Every Claude call goes through one place (clipper/llm.py).
  model: claude-opus-5-5         # main model for the Moment Picker and critics
  backup_model: claude-sonnet-5-5  # used only if the main model is overloaded or unreachable; null to turn off
  refusal_fallback: true         # server-side fallback if a request is declined
  daily_budget_usd: 30           # AI agents pause for the rest of the day past this (estimated from token usage)

judges:
  visual_judge: true             # Claude looks at 4 frames of each clip (about 2-4 cents per clip)

notify:
  # Put NTFY_TOPIC and/or DISCORD_WEBHOOK_URL in .env to get alerts on your phone.
  levels: [urgent, error, warn, info]
  quiet_hours: [1, 8]            # only urgent and error alerts between these hours (local time)
  digest_hour: 9                 # the Daily Digest arrives after this hour

ops:
  auto_update_ytdlp: true        # install new yt-dlp releases (sites break old versions)
  auto_restart: true             # restart by itself when idle after updates or settings changes
  keep_backups: 56               # database snapshots kept (every 6h = 2 weeks)
